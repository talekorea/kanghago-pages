<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>강하고 — 회원가입</title>
<style>
  :root { --gold:#C9973A; --navy:#1B2A3B; --bg:#F4EFE6; --ivory:#FAF6EE; }
  * { box-sizing: border-box; }
  body { font-family:'Pretendard',-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif;
    margin:0; background:var(--bg); color:#1d1d1f; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; border-radius:16px; padding:36px 34px; max-width:460px; width:100%;
    box-shadow:0 8px 28px rgba(27,42,59,0.12); }
  .brand { text-align:center; margin-bottom:6px; }
  .brand .logo { font-size:26px; font-weight:800; color:var(--gold); letter-spacing:-0.5px; }
  h1 { margin:8px 0 4px; font-size:20px; color:var(--navy); text-align:center; }
  .sub { color:#888; font-size:13px; margin-bottom:22px; text-align:center; }
  label { display:block; font-size:12px; font-weight:600; color:#444; margin:12px 0 5px; }
  input { width:100%; padding:11px 13px; border:1px solid #d4c5a8; border-radius:8px;
    font-size:15px; font-family:inherit; background:var(--ivory); }
  input:focus { outline:none; border-color:var(--gold); }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  button.submit { width:100%; margin-top:22px; padding:13px; background:var(--navy); color:#fff;
    border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; }
  button.submit:hover:not(:disabled) { background:#0f1d2c; }
  button.submit:disabled { background:#aaa; cursor:not-allowed; }
  .msg { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13px; line-height:1.5; }
  .msg.ok { background:#e8f5e9; border:1px solid #4caf50; color:#1b5e20; }
  .msg.err { background:#fff5f5; border:1px solid #f5c2c7; color:#c0392b; }
  .footer { text-align:center; color:#999; font-size:12px; margin-top:20px; }
  .footer a { color:var(--gold); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="logo">강하고</span></div>
  <h1>회원가입</h1>
  <div class="sub">한-중 1688 무역대행 · 가입 후 관리자 승인을 거칩니다</div>
  <form id="signupForm">
    <label>이메일 *</label>
    <input id="email" type="email" required autocomplete="email" placeholder="company@example.com" />
    <label>비밀번호 * <span style="color:#999;font-weight:400;">(6자 이상)</span></label>
    <input id="password" type="password" required minlength="6" autocomplete="new-password" />
    <label>회사명 *</label>
    <input id="company" type="text" required placeholder="㈜동부무역" />
    <div class="row">
      <div>
        <label>사업자번호</label>
        <input id="bizNo" type="text" placeholder="000-00-00000" />
      </div>
      <div>
        <label>담당자 *</label>
        <input id="contact" type="text" required placeholder="홍길동" />
      </div>
    </div>
    <label>연락처 *</label>
    <input id="phone" type="tel" required placeholder="010-1234-5678" />
    <button type="submit" class="submit" id="submitBtn">가입 신청</button>
  </form>
  <div id="msg"></div>
  <div class="footer">이미 회원이신가요? <a href="/member-login.html">로그인</a></div>
</div>

<script type="module">
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  const show = (t, k) => { msg.className = 'msg ' + (k||''); msg.innerHTML = t; };

  let supabase = null;
  async function loadSupabase() {
    const cfg = await (await fetch('/api/agent-config')).json();
    if (cfg.error) throw new Error(cfg.error);
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/+esm');
    supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  }

  document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = '처리 중...'; show('', '');
    try {
      if (!supabase) await loadSupabase();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      // 1) Supabase Auth signUp
      const { data, error } = await supabase.auth.signUp({ email, password });
      if (error) throw error;
      const session = data.session;
      if (!session) {
        // 이메일 확인 필요 설정인 경우 — 토큰 없이 가입만 안내
        show('✅ 가입 신청 완료. 이메일 인증 후 관리자 승인을 기다려 주세요.', 'ok');
        btn.textContent = '신청 완료';
        return;
      }
      // 2) members 테이블에 정보 저장 (백엔드, status: pending)
      const r = await fetch('/api/members', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + session.access_token, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          op: 'signup',
          company_name: document.getElementById('company').value.trim(),
          business_number: document.getElementById('bizNo').value.trim(),
          contact_name: document.getElementById('contact').value.trim(),
          phone: document.getElementById('phone').value.trim(),
        }),
      });
      const out = await r.json();
      if (!r.ok) throw new Error(out.error || 'HTTP ' + r.status);
      show('✅ <strong>가입 신청이 완료됐습니다.</strong><br>관리자 승인 후 로그인하실 수 있습니다. (승인 시 안내드립니다)', 'ok');
      btn.textContent = '신청 완료';
    } catch (err) {
      console.error(err);
      show('❌ ' + (err.message || '가입 실패'), 'err');
      btn.disabled = false; btn.textContent = '가입 신청';
    }
  });
</script>
</body>
</html>
