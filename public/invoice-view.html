<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>강하고 청구서 — 물류비</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root { --navy:#1B2A3B; --gold:#C9973A; --bg:#F4EFE6; --ivory:#FAF6EE; --dim:#666; --line:#e8e0d0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#1d1d1f;
    font-family:'Pretendard Variable','Pretendard',-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif; }
  .container { max-width:760px; margin:24px auto; background:#fff; padding:28px 32px; border-radius:14px;
    box-shadow:0 6px 24px rgba(0,0,0,0.08); }
  header { border-bottom:3px solid var(--navy); padding-bottom:16px; margin-bottom:20px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:18px; }
  header img { height:48px; width:auto; }
  header h1 { margin:0; font-size:23px; color:var(--navy); }
  header .sub { font-size:11px; color:var(--dim); margin-top:2px; letter-spacing:.05em; }
  header .meta { text-align:right; font-size:11px; line-height:1.7; }
  header .meta strong { color:var(--navy); }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
  .card { padding:12px 14px; background:var(--ivory); border-radius:8px; }
  .card .label { font-size:10px; color:#888; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; }
  .card .value { font-size:13px; font-weight:600; color:var(--navy); margin-top:3px; }
  .card .sub { font-size:11px; color:var(--dim); margin-top:2px; }

  /* 물류비 항목 표 — 좁고 정돈된 레이아웃 (사장님 목업) */
  .items { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:8px; }
  .items thead { background:var(--navy); color:#fff; }
  .items th { padding:8px 12px; text-align:left; font-weight:600; font-size:12px; }
  .items th.num { text-align:right; }
  .items tbody td { padding:7px 12px; border-bottom:1px solid var(--line); }
  .items tbody td.num { text-align:right; font-family:ui-monospace,'SF Mono',Consolas,monospace; }
  .items tbody td.sub-row { padding:4px 12px 4px 28px; font-size:11px; color:var(--dim); border-bottom:1px dashed #f0e8d8; }
  .items tfoot td { padding:8px 12px; }
  .items tfoot .subtotal { background:var(--ivory); font-weight:600; }
  .items tfoot .subtotal td { border-top:1px solid var(--gold); }
  .items tfoot .vat td { color:var(--dim); font-size:12px; }

  /* 최종 결제금액 부각 */
  .grand-total { margin:18px 0; padding:20px 24px;
    background:linear-gradient(135deg,var(--navy) 0%,#2c4060 100%);
    color:#F4EFE6; border-radius:12px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 12px rgba(27,42,59,0.25); }
  .grand-total .lbl { font-size:11px; letter-spacing:0.15em; color:#ffd87a; text-transform:uppercase; font-weight:600; }
  .grand-total .lbl-sub { font-size:10px; color:#9bb5d6; margin-top:2px; }
  .grand-total .amt { font-size:34px; font-weight:800; color:var(--gold);
    font-family:ui-monospace,monospace; letter-spacing:-0.01em; }

  /* FTA 절세 안내 (결제금액 미포함) */
  .fta-note { margin:14px 0 6px; padding:11px 14px; background:#FAF6EE; border-left:4px solid var(--gold); border-radius:6px; font-size:12px; color:var(--dim); }
  .fta-note .title { font-weight:700; color:var(--navy); margin-bottom:5px; font-size:12px; }
  .fta-note .row { display:flex; justify-content:space-between; margin-top:3px; }
  .fta-note .row span:last-child { font-family:ui-monospace,monospace; }
  .fta-note .footer { margin-top:5px; color:#0a7b40; font-size:11px; }

  /* 결제 버튼 */
  .pay-btn-wrap { text-align:center; margin:24px 0 12px; }
  .pay-btn { display:inline-block; padding:16px 52px; background:#2BB673; color:#fff;
    border:none; border-radius:10px; font-size:17px; font-weight:700; cursor:pointer;
    text-decoration:none; box-shadow:0 4px 12px rgba(43,182,115,0.3); transition:transform 0.1s, box-shadow 0.1s; }
  .pay-btn:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(43,182,115,0.4); }
  .pay-btn:disabled, .pay-btn.disabled { background:#ccc; cursor:not-allowed; box-shadow:none; transform:none; }
  /* [v3.2.141] 계좌이체 안내 (페이앱 결제하기 버튼 대체) */
  .bank-guide { display:inline-block; text-align:center; padding:22px 40px; background:#FAF6EE; border:2px solid #C9973A; border-radius:12px; box-shadow:0 4px 12px rgba(201,151,58,0.15); max-width:520px; }
  .bank-guide-title { font-size:15px; font-weight:700; color:#1B2A3B; margin-bottom:10px; }
  .bank-guide-amt { font-size:26px; font-weight:800; color:#C9973A; margin-bottom:10px; }
  .bank-guide-bank { font-size:18px; font-weight:700; color:#1B2A3B; font-family:ui-monospace,monospace; letter-spacing:0.3px; }
  .bank-guide-holder { font-size:13px; color:#666; margin-top:3px; }
  .bank-guide-note { font-size:12px; color:#666; margin-top:14px; line-height:1.7; text-align:left; padding-top:12px; border-top:1px dashed #d0c8b0; }

  .foot { font-size:11px; color:#888; text-align:center; line-height:1.7; padding-top:16px; border-top:1px solid var(--line); }
  .loading, .err { padding:60px 30px; text-align:center; color:#888; }
  .err { color:#c0392b; }

  @media (max-width:600px) {
    body { padding:6px; }
    .container { padding:18px; }
    .info-grid { grid-template-columns:1fr; }
    header { flex-direction:column; }
    header .meta { text-align:left; }
    .grand-total { flex-direction:column; gap:10px; text-align:center; }
    .grand-total .amt { font-size:28px; }
    .pay-btn { padding:14px 32px; font-size:15px; width:90%; }
  }
</style>
</head>
<body>
<div class="container">
  <div id="root"><div class="loading">⏳ 청구서 불러오는 중...</div></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const mailbox = params.get('mailbox') || params.get('ship') || '';

async function loadInvoice() {
  const root = document.getElementById('root');
  if (!mailbox) {
    root.innerHTML = '<div class="err">⚠ 사서함 번호가 URL에 없습니다.</div>';
    return;
  }
  try {
    const r = await fetch('/api/invoice-view?mailbox=' + encodeURIComponent(mailbox));
    const data = await r.json();
    if (!r.ok || !data.ok) {
      root.innerHTML = '<div class="err">⚠ ' + (data.error || ('HTTP ' + r.status)) + '</div>';
      return;
    }
    render(data);
  } catch (e) {
    root.innerHTML = '<div class="err">⚠ 청구서 로드 실패: ' + e.message + '</div>';
  }
}

function fmtKrw(n) { return '₩' + Math.round(parseFloat(n) || 0).toLocaleString(); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// v3.2.82: 관부가세 비교(예상) — 도구가 URL 파라미터로 전달한 숫자를 그대로 렌더(서버 재계산 없음, 도구와 1원까지 동일).
//   ★기존 청구서 스타일 재사용: 비교 박스 = 발행처/고객 카드 톤(--ivory·라운드), 절감 바 = --gold 바.
//   파라미터 없음/불완전/절감0 → '' 반환 → 섹션 숨김(청구서 안 깨짐).
function renderTariffCompare() {
  const bd = parseFloat(params.get('tcbd')), bv = parseFloat(params.get('tcbv')), bt = parseFloat(params.get('tcbt'));
  const fd = parseFloat(params.get('tcfd')), fv = parseFloat(params.get('tcfv')), ft = parseFloat(params.get('tcft'));
  const sv = parseFloat(params.get('tcsv')); const fl = params.get('tcfl') || '선택 FTA';
  if (![bd, bv, bt, fd, fv, ft, sv].every(n => !isNaN(n)) || sv <= 0) return '';
  return `
    <div style="margin-bottom:18px;">
      <div style="font-size:11px; color:#888; margin-bottom:6px;">관부가세 비교 <span style="color:#aaa;">(예상 · 고객 통관 비용 — 강하고 청구금액과 <strong>별개</strong>)</span></div>
      <div style="display:flex; gap:12px; align-items:stretch;">
        <div style="flex:1; padding:11px 14px; background:var(--ivory); border-radius:8px; opacity:.7; font-size:12px;">
          <div style="font-weight:700; color:var(--navy); margin-bottom:6px;">기본세율 <span style="font-weight:400; color:#aaa;">(FTA 미적용)</span></div>
          <div style="display:flex; justify-content:space-between; color:#999; text-decoration:line-through;"><span>관세</span><span style="font-family:ui-monospace,monospace;">${fmtKrw(bd)}</span></div>
          <div style="display:flex; justify-content:space-between; color:#999; text-decoration:line-through;"><span>부가세 10%</span><span style="font-family:ui-monospace,monospace;">${fmtKrw(bv)}</span></div>
          <div style="display:flex; justify-content:space-between; margin-top:5px; padding-top:5px; border-top:1px solid var(--line); color:#999; text-decoration:line-through; font-weight:700;"><span>합계</span><span style="font-family:ui-monospace,monospace;">${fmtKrw(bt)}</span></div>
        </div>
        <div style="flex:1; padding:11px 14px; background:var(--ivory); border:2px solid var(--gold); border-radius:8px; font-size:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <span style="font-weight:700; color:var(--navy);">${esc(fl)}</span>
            <span style="background:var(--gold); color:#fff; font-size:9px; font-weight:700; padding:2px 9px; border-radius:10px; letter-spacing:.04em;">적용</span>
          </div>
          <div style="display:flex; justify-content:space-between;"><span>관세</span><span style="font-family:ui-monospace,monospace;">${fmtKrw(fd)}</span></div>
          <div style="display:flex; justify-content:space-between;"><span>부가세 10%</span><span style="font-family:ui-monospace,monospace;">${fmtKrw(fv)}</span></div>
          <div style="display:flex; justify-content:space-between; margin-top:5px; padding-top:5px; border-top:1px solid var(--line); font-weight:700; color:var(--navy);"><span>합계</span><span style="font-family:ui-monospace,monospace;">${fmtKrw(ft)}</span></div>
        </div>
      </div>
      <div style="background:var(--gold); color:#fff; border-radius:8px; padding:11px 16px; margin-top:10px; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; font-weight:700;">FTA 적용 절감액 <span style="font-weight:400; opacity:.85;">(기본세율 − ${esc(fl)})</span></span>
        <span style="font-family:ui-monospace,monospace; font-size:16px; font-weight:800;">− ${fmtKrw(sv)}</span>
      </div>
      <div style="font-size:10px; color:#aaa; margin-top:6px;">※ 표시 금액은 예상치이며, 정확한 관세·부가세는 협력 관세사 검토 후 안내됩니다.</div>
    </div>`;
}

function render(d) {
  const root = document.getElementById('root');
  const s = d.shipment, c = d.customer, t = d.totals, bd = d.breakdown || {}, al = d.alicoin || {};
  // [v3.2.139] 발행주체 = 주식회사 테일코리아(단일 진실원). API에 issuer 없으면 폴백.
  const issuer = d.issuer || {
    name: '주식회사 테일코리아', biz: '162-86-01960',
    addr: '인천시 서구 북항로 207번길 55',
    tel: '010-3622-7995', email: 'admin@talekorea.com',
    bank: '하나은행 121-910031-58704', bankHolder: '예금주 주식회사 테일코리아',
  };
  const ftaSavingKrw = (t && t.ftaSavingKrw) || 0;

  // v3.2.18 P0: 물류비 청구서. 신고가 폴백 폐기 — 청구금액_KRW = 0이면 0 표시.
  const claimAmount = t.claimKrw || 0;
  // [v3.2.141] 페이앱 영구 거절 → 결제수단 = 계좌이체(테일코리아 하나은행) + 세금계산서. 결제하기 버튼 제거.
  const paidIn = !!d.paidInAt;

  // 물류비 항목 — 해당분만 표시 (0 또는 빈값은 줄 자체 생략)
  // v3.2.31: CO는 절세 > 0일 때만 청구. note에 "FTA 적용 관세 ₩XXX 절감 (CO 발급 기준)"
  const itemRows = [];
  if (bd.bl > 0)      itemRows.push({ name: 'BL 발급료',          amount: bd.bl });
  if (bd.sea > 0)     itemRows.push({ name: '해상운임',            amount: bd.sea });
  if (bd.co > 0)      itemRows.push({
    name: '원산지증명서 (CO)', amount: bd.co,
    note: ftaSavingKrw > 0 ? `한중 FTA 적용으로 관세 ${fmtKrw(ftaSavingKrw)} 절감 (CO 발급 기준)` : ''
  });
  if (bd.parcel > 0)  itemRows.push({ name: '택배 (매트릭스)',      amount: bd.parcel });
  if (bd.freight > 0) itemRows.push({ name: '화물',                amount: bd.freight });
  if (bd.milkrun > 0) itemRows.push({ name: '밀크런',              amount: bd.milkrun, note: '⌈CBM/1.5⌉ × 30,000 (pre-VAT)' });   // v3.2.38
  if (bd.coupang > 0) itemRows.push({ name: '쿠팡 밀크런',         amount: bd.coupang });

  const preVatSum = itemRows.reduce((s, r) => s + r.amount, 0);
  const preVat = (t.preVat && t.preVat > 0) ? t.preVat : preVatSum;
  const vat = t.vat || Math.round(preVat * 0.10);

  root.innerHTML = `
    <header>
      <div style="display:flex; align-items:center; gap:14px;">
        <img src="/kanghago_logo.png" alt="강하고" onerror="this.style.display='none'" />
        <div>
          <h1>강하고 물류비 청구서</h1>
          <div class="sub">KANGHAGO LOGISTICS INVOICE</div>
        </div>
      </div>
      <div class="meta">
        <div><strong>사서함</strong> ${esc(s.mailbox)}</div>
        <div><strong>발행일</strong> ${esc((d.shipment && d.shipment.issueDate) ? d.shipment.issueDate.slice(0,10) : d.generatedAt.slice(0, 10))}</div>
        ${s.blNo ? `<div><strong>BL No.</strong> ${esc(s.blNo)}</div>` : ''}
        ${s.forwarder ? `<div><strong>포워딩</strong> ${esc(s.forwarder)}</div>` : ''}
      </div>
    </header>

    ${renderTariffCompare()}

    <div class="info-grid">
      <div class="card">
        <div class="label">발행처</div>
        <div class="value">${esc(issuer.name)}</div>
        <div class="sub">사업자 ${esc(issuer.biz)}</div>
        <div class="sub">${esc(issuer.addr)}</div>
        <div class="sub">${esc(issuer.tel)} · ${esc(issuer.email)}</div>
        <div class="sub" style="margin-top:5px; padding-top:5px; border-top:1px dashed #d0c8b0; color:#1B2A3B; font-weight:600;">💳 입금: ${esc(issuer.bank)}</div>
        ${issuer.bankHolder ? `<div class="sub" style="color:#888;">${esc(issuer.bankHolder)}</div>` : ''}
      </div>
      <div class="card">
        <div class="label">고객</div>
        <div class="value">${esc(s.mailbox)} ${esc(c && c.name || '-')}${c && c.company ? ' (' + esc(c.company) + ')' : ''}</div>
        ${c && c.bizNo ? `<div class="sub">사업자: ${esc(c.bizNo)}</div>` : ''}
        ${c && c.address ? `<div class="sub">${esc(c.address)}</div>` : ''}
        ${c && c.phone ? `<div class="sub">Tel: ${esc(c.phone)}</div>` : ''}
      </div>
    </div>

    <table class="items">
      <thead>
        <tr>
          <th style="width:60%;">항목 (물류비)</th>
          <th class="num" style="width:40%;">금액 (KRW, VAT 제외)</th>
        </tr>
      </thead>
      <tbody>
        ${itemRows.length === 0 ? `
          <tr><td colspan="2" style="text-align:center; padding:24px; color:#888;">(물류비 항목 미발생 — 도구 §12 청구서 발행 필요)</td></tr>
        ` : itemRows.map(r => `
          <tr>
            <td>${esc(r.name)}</td>
            <td class="num">${fmtKrw(r.amount)}</td>
          </tr>
          ${r.note ? `<tr><td colspan="2" style="padding:3px 12px 9px 28px; font-size:11px; color:#0a7b40; border-bottom:1px dashed #f0e8d8;">💡 ${esc(r.note)}</td></tr>` : ''}
        `).join('')}
        ${(bd.co === 0 && ftaSavingKrw === 0 && itemRows.length > 0) ? `
          <tr><td colspan="2" style="padding:8px 12px; font-size:11px; color:#888; background:#fafaf5;">
            ℹ 이 제품은 FTA 절세가 없어 원산지증명서(CO)가 필요하지 않습니다 (CO 발급료 미청구).
          </td></tr>
        ` : ''}
      </tbody>
      <tfoot>
        <tr class="subtotal">
          <td style="text-align:right;">합계 (pre-VAT)</td>
          <td class="num">${fmtKrw(preVat)}</td>
        </tr>
        <tr class="vat">
          <td style="text-align:right;">부가세 10%</td>
          <td class="num">+ ${fmtKrw(vat)}</td>
        </tr>
      </tfoot>
    </table>

    <div class="grand-total">
      <div>
        <div class="lbl">국내 결제금액 (계좌이체·세금계산서)</div>
        <div class="lbl-sub">국내운임 × 1.10 (택배/화물/밀크런만 +10% 과세)</div>
      </div>
      <div class="amt">${fmtKrw(claimAmount)}</div>
    </div>

    ${(al.totalCny > 0 || al.localWorkCny > 0) ? `
    <div style="background:#eef4fb; border:1.5px solid #1B5E9A; border-radius:12px; padding:18px 20px; margin-top:16px;">
      <div style="font-weight:700; color:#1B5E9A; font-size:14px; margin-bottom:10px;">🪙 알리코인(예치금) 사용내역 <span style="font-weight:400; font-size:11px; color:#888;">— 위 국내 결제와 별도 · 계좌이체 금액 아님</span></div>
      <div style="font-size:12px; color:#888; font-weight:600; margin-bottom:4px;">［강하고 서비스 수수료］</div>
      <table style="width:100%; font-size:13px; border-collapse:collapse;">
        <tr><td style="padding:4px 0;">BL 발급료</td><td class="num" style="text-align:right; font-family:monospace;">¥${(al.blCny||0).toFixed(2)}</td></tr>
        <tr><td style="padding:4px 0;">해운비 <span style="font-size:11px; color:#888;">(FREIGHT PREPAID)</span></td><td class="num" style="text-align:right; font-family:monospace;">¥${(al.seaCny||0).toFixed(2)}</td></tr>
        ${(al.coCny||0) > 0 ? `<tr><td style="padding:4px 0;">원산지증명(CO)</td><td class="num" style="text-align:right; font-family:monospace;">¥${al.coCny.toFixed(2)}</td></tr>` : ''}
        <tr><td style="padding:4px 0;">작업수수료 <span style="font-size:11px; color:#888;">(핸들링+DOCUMENT FEE)</span></td><td class="num" style="text-align:right; font-family:monospace;">¥${(al.workfeeCny||0).toFixed(2)}</td></tr>
        <tr style="border-top:1px dashed #1B5E9A; font-weight:600;"><td style="padding:5px 0; font-size:12px;">└ 서비스 수수료 소계</td><td class="num" style="text-align:right; font-family:monospace;">¥${(al.totalCny||0).toFixed(2)}</td></tr>
      </table>
      ${(al.localWorkCny > 0) ? `
      <div style="font-size:12px; color:#888; font-weight:600; margin:10px 0 4px 0;">［중국 현지 작업비］ <span style="font-weight:400; color:#c0392b;">제품 신고가에 이미 반영 · 사용내역 참고</span></div>
      <table style="width:100%; font-size:13px; border-collapse:collapse;">
        <tr><td style="padding:4px 0;">🏭 중국 현지 작업비</td><td class="num" style="text-align:right; font-family:monospace; font-weight:700;">¥${(al.localWorkCny||0).toFixed(2)}</td></tr>
      </table>
      <details style="margin-top:4px;"><summary style="cursor:pointer; font-size:12px; color:#1B5E9A;">세부보기 ▼ (${(al.localWorkItems||[]).length}항목)</summary>
        <table style="width:100%; border-collapse:collapse; margin-top:5px; font-size:12px; color:#555;">${(al.localWorkItems||[]).map(it => { const qu=(it.qty!=null&&it.unit!=null)?`${it.qty}개 × ¥${it.unit}`:''; return `<tr><td style="padding:3px 6px 3px 0;">${esc(it.label)}</td><td style="padding:3px 8px; color:#888; white-space:nowrap;">${qu}</td><td style="padding:3px 0; text-align:right; font-family:ui-monospace,monospace; white-space:nowrap;">¥${(it.cny||0).toFixed(2)}</td></tr>`; }).join('')}</table>
      </details>` : ''}
      <div style="border-top:1.5px solid #1B5E9A; margin-top:8px; padding-top:6px; display:flex; justify-content:space-between; font-weight:700; color:#1B5E9A;"><span>🪙 알리코인 총 사용 (참고)</span><span style="font-family:monospace;">¥${(al.grandUseCny != null ? al.grandUseCny : ((al.totalCny||0)+(al.localWorkCny||0))).toFixed(2)}</span></div>
      <div style="margin-top:9px; font-size:12px; color:#1B5E9A;">위 금액은 <strong>알리코인(예치금)에서 이미 차감</strong>되었습니다. 계좌이체로 추가 청구하지 않습니다.</div>
    </div>` : ''}

    ${(t.invoiceKrw > 0) ? `
      <div class="fta-note">
        <div class="title">💡 FTA 절세 안내 (결제금액 미포함)</div>
        <div class="row"><span>· 신고가 (인보이스 KRW)</span><span>${fmtKrw(t.invoiceKrw)}</span></div>
        <!-- v3.2.31: 적용 FTA 미선택 표시 제거 — 내부 용어. 한중/아태/일반만 표시 -->
        ${(t.appliedFta && t.appliedFta !== '미선택') ? `<div class="row"><span>· 적용 FTA</span><span>${esc(t.appliedFta)}</span></div>` : ''}
        ${ftaSavingKrw > 0 ? `<div class="row" style="color:#0a7b40; font-weight:600;"><span>· FTA 적용 관세 절감</span><span>${fmtKrw(ftaSavingKrw)}</span></div>` : ''}
        <div class="footer">→ 관세·수입부가세는 관세사가 화주에게 직접 청구합니다. 강하고 청구서엔 미포함.</div>
      </div>
    ` : ''}

    <div class="pay-btn-wrap">
      ${paidIn
        ? `<button class="pay-btn disabled" disabled>✅ 입금 확인 완료 — 통관 진행 중</button>`
        : claimAmount > 0
          ? `<div class="bank-guide">
               <div class="bank-guide-title">💳 아래 계좌로 입금해 주세요 (계좌이체)</div>
               <div class="bank-guide-amt">${fmtKrw(claimAmount)} <span style="font-size:13px; font-weight:400; color:#666;">(VAT 포함)</span></div>
               <div class="bank-guide-bank">${esc(issuer.bank)}</div>
               ${issuer.bankHolder ? `<div class="bank-guide-holder">${esc(issuer.bankHolder)}</div>` : ''}
               <div class="bank-guide-note">※ 입금 시 <strong>사서함번호(${esc(s.mailbox)})</strong> 또는 <strong>상호</strong>를 입금자명에 기재해 주세요.<br>※ 세금계산서를 발행해 드립니다. 입금 확인 후 영업일 기준 1~2일 내 통관을 진행합니다.</div>
             </div>`
          : `<button class="pay-btn disabled" disabled>⏳ 청구서 발행 대기 (직원이 §9에서 발행)</button>`
      }
    </div>

    <div class="foot">
      <div>강하고 (Kanghago) · 한·중 1688 무역대행 · 발행: ${esc(issuer.name)} (${esc(issuer.biz)})</div>
      <div>문의: ${esc(issuer.tel)} · ${esc(issuer.email)}</div>
      <div style="margin-top:6px; color:#bbb;">청구번호 ${esc(s.mailbox)} · 발행 ${esc((d.shipment && d.shipment.issueDate) ? d.shipment.issueDate.slice(0,10) : d.generatedAt.slice(0, 10))}</div>
      <div style="margin-top:3px; color:#999; font-size:10px;">국내 결제 = 국내운임(택배/화물/밀크런) × 1.10 · BL·해운비·CO·작업수수료는 알리코인(CNY) 차감(FREIGHT PREPAID)</div>
    </div>
  `;
}

loadInvoice();
</script>
</body>
</html>
