<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>강하고 청구서 — 물류비</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root { --navy:#1B2A3B; --gold:#C9973A; --bg:#F4EFE6; --ivory:#FAF6EE; --dim:#666; --line:#e8e0d0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#1d1d1f;
    font-family:'Pretendard Variable','Pretendard',-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif; }
  .container { max-width:760px; margin:24px auto; background:#fff; padding:28px 32px; border-radius:14px;
    box-shadow:0 6px 24px rgba(0,0,0,0.08); }
  header { border-bottom:3px solid var(--navy); padding-bottom:16px; margin-bottom:20px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:18px; }
  header img { height:48px; width:auto; }
  header h1 { margin:0; font-size:23px; color:var(--navy); }
  header .sub { font-size:11px; color:var(--dim); margin-top:2px; letter-spacing:.05em; }
  header .meta { text-align:right; font-size:11px; line-height:1.7; }
  header .meta strong { color:var(--navy); }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
  .card { padding:12px 14px; background:var(--ivory); border-radius:8px; }
  .card .label { font-size:10px; color:#888; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; }
  .card .value { font-size:13px; font-weight:600; color:var(--navy); margin-top:3px; }
  .card .sub { font-size:11px; color:var(--dim); margin-top:2px; }

  /* 물류비 항목 표 — 좁고 정돈된 레이아웃 (사장님 목업) */
  .items { width:100%; border-collapse:collapse; font-size:13px; margin-bottom:8px; }
  .items thead { background:var(--navy); color:#fff; }
  .items th { padding:8px 12px; text-align:left; font-weight:600; font-size:12px; }
  .items th.num { text-align:right; }
  .items tbody td { padding:7px 12px; border-bottom:1px solid var(--line); }
  .items tbody td.num { text-align:right; font-family:ui-monospace,'SF Mono',Consolas,monospace; }
  .items tbody td.sub-row { padding:4px 12px 4px 28px; font-size:11px; color:var(--dim); border-bottom:1px dashed #f0e8d8; }
  .items tfoot td { padding:8px 12px; }
  .items tfoot .subtotal { background:var(--ivory); font-weight:600; }
  .items tfoot .subtotal td { border-top:1px solid var(--gold); }
  .items tfoot .vat td { color:var(--dim); font-size:12px; }

  /* 최종 결제금액 부각 */
  .grand-total { margin:18px 0; padding:20px 24px;
    background:linear-gradient(135deg,var(--navy) 0%,#2c4060 100%);
    color:#F4EFE6; border-radius:12px;
    display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 12px rgba(27,42,59,0.25); }
  .grand-total .lbl { font-size:11px; letter-spacing:0.15em; color:#ffd87a; text-transform:uppercase; font-weight:600; }
  .grand-total .lbl-sub { font-size:10px; color:#9bb5d6; margin-top:2px; }
  .grand-total .amt { font-size:34px; font-weight:800; color:var(--gold);
    font-family:ui-monospace,monospace; letter-spacing:-0.01em; }

  /* FTA 절세 안내 (결제금액 미포함) */
  .fta-note { margin:14px 0 6px; padding:11px 14px; background:#FAF6EE; border-left:4px solid var(--gold); border-radius:6px; font-size:12px; color:var(--dim); }
  .fta-note .title { font-weight:700; color:var(--navy); margin-bottom:5px; font-size:12px; }
  .fta-note .row { display:flex; justify-content:space-between; margin-top:3px; }
  .fta-note .row span:last-child { font-family:ui-monospace,monospace; }
  .fta-note .footer { margin-top:5px; color:#0a7b40; font-size:11px; }

  /* 결제 버튼 */
  .pay-btn-wrap { text-align:center; margin:24px 0 12px; }
  .pay-btn { display:inline-block; padding:16px 52px; background:#2BB673; color:#fff;
    border:none; border-radius:10px; font-size:17px; font-weight:700; cursor:pointer;
    text-decoration:none; box-shadow:0 4px 12px rgba(43,182,115,0.3); transition:transform 0.1s, box-shadow 0.1s; }
  .pay-btn:hover { transform:translateY(-1px); box-shadow:0 6px 16px rgba(43,182,115,0.4); }
  .pay-btn:disabled, .pay-btn.disabled { background:#ccc; cursor:not-allowed; box-shadow:none; transform:none; }

  .foot { font-size:11px; color:#888; text-align:center; line-height:1.7; padding-top:16px; border-top:1px solid var(--line); }
  .loading, .err { padding:60px 30px; text-align:center; color:#888; }
  .err { color:#c0392b; }

  @media (max-width:600px) {
    body { padding:6px; }
    .container { padding:18px; }
    .info-grid { grid-template-columns:1fr; }
    header { flex-direction:column; }
    header .meta { text-align:left; }
    .grand-total { flex-direction:column; gap:10px; text-align:center; }
    .grand-total .amt { font-size:28px; }
    .pay-btn { padding:14px 32px; font-size:15px; width:90%; }
  }
</style>
</head>
<body>
<div class="container">
  <div id="root"><div class="loading">⏳ 청구서 불러오는 중...</div></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const mailbox = params.get('mailbox') || params.get('ship') || '';

async function loadInvoice() {
  const root = document.getElementById('root');
  if (!mailbox) {
    root.innerHTML = '<div class="err">⚠ 사서함 번호가 URL에 없습니다.</div>';
    return;
  }
  try {
    const r = await fetch('/api/invoice-view?mailbox=' + encodeURIComponent(mailbox));
    const data = await r.json();
    if (!r.ok || !data.ok) {
      root.innerHTML = '<div class="err">⚠ ' + (data.error || ('HTTP ' + r.status)) + '</div>';
      return;
    }
    render(data);
  } catch (e) {
    root.innerHTML = '<div class="err">⚠ 청구서 로드 실패: ' + e.message + '</div>';
  }
}

function fmtKrw(n) { return '₩' + Math.round(parseFloat(n) || 0).toLocaleString(); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function render(d) {
  const root = document.getElementById('root');
  const s = d.shipment, c = d.customer, t = d.totals, bd = d.breakdown || {};
  // v3.2.31: 발행처 강하고로 전환 + IBK 계좌. API에 issuer 없으면 폴백 (옛 사서함)
  const issuer = d.issuer || {
    name: '강하고 (Kanghago)', biz: '219-43-01430',
    addr: '인천광역시 서구 북항로207번길 55, 1동 2층',
    tel: '1661-5776', email: 'master@talekorea.com',
    bank: 'IBK기업은행 491-080376-04-014', bankHolder: '예금주 강지훈(강하고)',
  };
  const ftaSavingKrw = (t && t.ftaSavingKrw) || 0;

  // v3.2.18 P0: 물류비 청구서. 신고가 폴백 폐기 — 청구금액_KRW = 0이면 0 표시.
  const claimAmount = t.claimKrw || 0;
  const payappReady = !!d.payappUrl && d.payappStatus !== '결제완료';
  const payappPaid = d.payappStatus === '결제완료';

  // 물류비 항목 — 해당분만 표시 (0 또는 빈값은 줄 자체 생략)
  // v3.2.31: CO는 절세 > 0일 때만 청구. note에 "FTA 적용 관세 ₩XXX 절감 (CO 발급 기준)"
  const itemRows = [];
  if (bd.bl > 0)      itemRows.push({ name: 'BL 발급료',          amount: bd.bl });
  if (bd.sea > 0)     itemRows.push({ name: '해상운임',            amount: bd.sea });
  if (bd.co > 0)      itemRows.push({
    name: '원산지증명서 (CO)', amount: bd.co,
    note: ftaSavingKrw > 0 ? `한중 FTA 적용으로 관세 ${fmtKrw(ftaSavingKrw)} 절감 (CO 발급 기준)` : ''
  });
  if (bd.parcel > 0)  itemRows.push({ name: '택배 (매트릭스)',      amount: bd.parcel });
  if (bd.freight > 0) itemRows.push({ name: '화물',                amount: bd.freight });
  if (bd.milkrun > 0) itemRows.push({ name: '밀크런',              amount: bd.milkrun, note: '⌈CBM/1.5⌉ × 30,000 (pre-VAT)' });   // v3.2.38
  if (bd.coupang > 0) itemRows.push({ name: '쿠팡 밀크런',         amount: bd.coupang });

  const preVatSum = itemRows.reduce((s, r) => s + r.amount, 0);
  const preVat = (t.preVat && t.preVat > 0) ? t.preVat : preVatSum;
  const vat = t.vat || Math.round(preVat * 0.10);

  root.innerHTML = `
    <header>
      <div style="display:flex; align-items:center; gap:14px;">
        <img src="/kanghago_logo.png" alt="강하고" onerror="this.style.display='none'" />
        <div>
          <h1>강하고 물류비 청구서</h1>
          <div class="sub">KANGHAGO LOGISTICS INVOICE</div>
        </div>
      </div>
      <div class="meta">
        <div><strong>사서함</strong> ${esc(s.mailbox)}</div>
        <div><strong>발행일</strong> ${esc(d.generatedAt.slice(0, 10))}</div>
        ${s.blNo ? `<div><strong>BL No.</strong> ${esc(s.blNo)}</div>` : ''}
        ${s.forwarder ? `<div><strong>포워딩</strong> ${esc(s.forwarder)}</div>` : ''}
      </div>
    </header>

    <div class="info-grid">
      <div class="card">
        <div class="label">발행처</div>
        <div class="value">${esc(issuer.name)}</div>
        <div class="sub">사업자 ${esc(issuer.biz)}</div>
        <div class="sub">${esc(issuer.addr)}</div>
        <div class="sub">${esc(issuer.tel)} · ${esc(issuer.email)}</div>
        <div class="sub" style="margin-top:5px; padding-top:5px; border-top:1px dashed #d0c8b0; color:#1B2A3B; font-weight:600;">💳 입금: ${esc(issuer.bank)}</div>
        ${issuer.bankHolder ? `<div class="sub" style="color:#888;">${esc(issuer.bankHolder)}</div>` : ''}
      </div>
      <div class="card">
        <div class="label">고객</div>
        <div class="value">${esc(s.mailbox)} ${esc(c && c.name || '-')}${c && c.company ? ' (' + esc(c.company) + ')' : ''}</div>
        ${c && c.bizNo ? `<div class="sub">사업자: ${esc(c.bizNo)}</div>` : ''}
        ${c && c.address ? `<div class="sub">${esc(c.address)}</div>` : ''}
        ${c && c.phone ? `<div class="sub">Tel: ${esc(c.phone)}</div>` : ''}
      </div>
    </div>

    <table class="items">
      <thead>
        <tr>
          <th style="width:60%;">항목 (물류비)</th>
          <th class="num" style="width:40%;">금액 (KRW, VAT 제외)</th>
        </tr>
      </thead>
      <tbody>
        ${itemRows.length === 0 ? `
          <tr><td colspan="2" style="text-align:center; padding:24px; color:#888;">(물류비 항목 미발생 — 도구 §12 청구서 발행 필요)</td></tr>
        ` : itemRows.map(r => `
          <tr>
            <td>${esc(r.name)}</td>
            <td class="num">${fmtKrw(r.amount)}</td>
          </tr>
          ${r.note ? `<tr><td colspan="2" style="padding:3px 12px 9px 28px; font-size:11px; color:#0a7b40; border-bottom:1px dashed #f0e8d8;">💡 ${esc(r.note)}</td></tr>` : ''}
        `).join('')}
        ${(bd.co === 0 && ftaSavingKrw === 0 && itemRows.length > 0) ? `
          <tr><td colspan="2" style="padding:8px 12px; font-size:11px; color:#888; background:#fafaf5;">
            ℹ 이 제품은 FTA 절세가 없어 원산지증명서(CO)가 필요하지 않습니다 (CO 발급료 미청구).
          </td></tr>
        ` : ''}
      </tbody>
      <tfoot>
        <tr class="subtotal">
          <td style="text-align:right;">합계 (pre-VAT)</td>
          <td class="num">${fmtKrw(preVat)}</td>
        </tr>
        <tr class="vat">
          <td style="text-align:right;">부가세 10%</td>
          <td class="num">+ ${fmtKrw(vat)}</td>
        </tr>
      </tfoot>
    </table>

    <div class="grand-total">
      <div>
        <div class="lbl">최종 결제금액</div>
        <div class="lbl-sub">물류비 × 1.10 (전 항목 +10% 과세)</div>
      </div>
      <div class="amt">${fmtKrw(claimAmount)}</div>
    </div>

    ${(t.invoiceKrw > 0) ? `
      <div class="fta-note">
        <div class="title">💡 FTA 절세 안내 (결제금액 미포함)</div>
        <div class="row"><span>· 신고가 (인보이스 KRW)</span><span>${fmtKrw(t.invoiceKrw)}</span></div>
        <!-- v3.2.31: 적용 FTA 미선택 표시 제거 — 내부 용어. 한중/아태/일반만 표시 -->
        ${(t.appliedFta && t.appliedFta !== '미선택') ? `<div class="row"><span>· 적용 FTA</span><span>${esc(t.appliedFta)}</span></div>` : ''}
        ${ftaSavingKrw > 0 ? `<div class="row" style="color:#0a7b40; font-weight:600;"><span>· FTA 적용 관세 절감</span><span>${fmtKrw(ftaSavingKrw)}</span></div>` : ''}
        <div class="footer">→ 관세·수입부가세는 관세사가 화주에게 직접 청구합니다. 강하고 청구서엔 미포함.</div>
      </div>
    ` : ''}

    <div class="pay-btn-wrap">
      ${payappPaid
        ? `<button class="pay-btn disabled" disabled>✅ 결제 완료 — 통관 진행 중</button>`
        : payappReady && claimAmount > 0
          ? `<a class="pay-btn" href="${esc(d.payappUrl)}" target="_blank" rel="noopener">💳 결제하기 (${fmtKrw(claimAmount)})</a>`
          : `<button class="pay-btn disabled" disabled>⏳ 결제 URL 생성 대기 (직원이 §12에서 생성)</button>`
      }
    </div>

    <div class="foot">
      <div>강하고 (Kanghago) · 한·중 1688 무역대행 · 발행: ${esc(issuer.name)} (${esc(issuer.biz)})</div>
      <div>문의: 1661-5776 · master@talekorea.com</div>
      <div style="margin-top:6px; color:#bbb;">청구번호 ${esc(s.mailbox)} · 발행 ${esc(d.generatedAt.slice(0, 10))} · v3.2.38</div>
      <div style="margin-top:3px; color:#999; font-size:10px;">물류비 청구서 (BL · 해상운임 · CO · 택배 · 화물 · 밀크런 · 쿠팡밀크런) × 1.10</div>
    </div>
  `;
}

loadInvoice();
</script>
</body>
</html>
