<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>강하고 청구서 — 물류비</title>
<!-- invoice-view v3.2.223 — 우선순위 4블록(①입금 ②FTA ③알리코인 ④배차) — ?s= 지원 + ④배차 항상표시(출발/도착지). 계산 불변(표시만). -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root { --navy:#1B2A3B; --gold:#C9973A; --bg:#F4EFE6; --ivory:#FAF6EE; --dim:#666; --line:#e8e0d0;
    --blue:#1B5E9A; --green:#2BB673; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:#1d1d1f;
    font-family:'Pretendard Variable','Pretendard',-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif; }
  .container { max-width:760px; margin:24px auto; background:#fff; padding:28px 32px; border-radius:14px;
    box-shadow:0 6px 24px rgba(0,0,0,0.08); }

  /* 헤더 — 로고 좌 + 제목 | 우 메타 */
  header { border-bottom:3px solid var(--navy); padding-bottom:16px; margin-bottom:20px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:18px; }
  header img { height:52px; width:auto; }
  header h1 { margin:0; font-size:24px; color:var(--navy); letter-spacing:-0.01em; }
  header .sub { font-size:11px; color:var(--dim); margin-top:2px; letter-spacing:.08em; }
  header .meta { text-align:right; font-size:11.5px; line-height:1.75; color:var(--dim); }
  header .meta strong { color:var(--navy); }

  /* 발행처·수신처 2단 (맨 위) */
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  .card { padding:12px 14px; background:var(--ivory); border-radius:8px; }
  .card .label { font-size:10px; color:#888; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; }
  .card .value { font-size:13px; font-weight:700; color:var(--navy); margin-top:3px; }
  .card .sub { font-size:11px; color:var(--dim); margin-top:2px; }

  /* 우선순위 박스 공통 */
  .pri { border-radius:14px; margin:16px 0; overflow:hidden; }

  /* ① 실제 입금 금액 — 파란 강조(제일 큼) */
  .pay-box { border:2px solid var(--blue); background:linear-gradient(135deg,#eef5fc 0%,#dfecfa 100%);
    padding:22px 24px; }
  .pay-box .plabel { font-size:12px; font-weight:800; color:var(--blue); letter-spacing:.03em; }
  .pay-box .plabel .tag { font-size:10px; font-weight:600; color:#fff; background:var(--blue);
    padding:2px 8px; border-radius:10px; margin-left:6px; letter-spacing:0; }
  .pay-box .pamt { font-size:38px; font-weight:800; color:var(--navy);
    font-family:ui-monospace,'SF Mono',monospace; letter-spacing:-0.02em; line-height:1.1; margin:8px 0 4px; }
  .pay-box .pamt small { font-size:14px; font-weight:500; color:var(--dim); }
  .pay-box .pbreak { font-size:12px; color:var(--dim); }
  .pay-box .bank { margin-top:14px; padding-top:13px; border-top:1px dashed #b9c9dc; }
  .pay-box .bank .bk { font-size:18px; font-weight:800; color:var(--navy);
    font-family:ui-monospace,monospace; letter-spacing:0.3px; }
  .pay-box .bank .holder { font-size:12px; color:var(--dim); margin-top:2px; }
  .pay-box .depositor { margin-top:10px; font-size:12px; color:#374; background:#fffdf6;
    border:1px solid #ecdfb8; border-radius:7px; padding:9px 12px; line-height:1.6; }
  .pay-box .depositor strong { color:#b26a00; }
  .pay-box.paid { border-color:var(--green); background:linear-gradient(135deg,#eefaf3,#dcf5e7); }
  .pay-box .paid-badge { font-size:20px; font-weight:800; color:var(--green); }
  .pay-box.wait { border-color:#ccc; background:#fafafa; }

  /* details 공통 (② ③ 펼침) */
  details.pri { border:1.5px solid var(--line); }
  details.pri > summary { list-style:none; cursor:pointer; padding:15px 20px; display:flex;
    justify-content:space-between; align-items:center; gap:12px; user-select:none; }
  details.pri > summary::-webkit-details-marker { display:none; }
  details.pri > summary .chev { transition:transform .2s; font-size:11px; opacity:.5; }
  details.pri[open] > summary .chev { transform:rotate(180deg); }
  details.pri .body { padding:4px 20px 18px; }

  /* ② FTA 절감 — 초록 */
  .fta-box { background:#f1faf4; }
  .fta-box { border-color:var(--green) !important; }
  .fta-box > summary .stitle { font-weight:800; color:#1a8a52; font-size:14px; }
  .fta-box > summary .samt { font-family:ui-monospace,monospace; font-weight:800; font-size:16px; color:#1a8a52; }

  /* ③ 알리코인 — 회색 */
  .coin-box { background:#f5f6f8; border-color:#c8ccd2 !important; }
  .coin-box > summary .stitle { font-weight:700; color:#556; font-size:14px; }
  .coin-box > summary .stitle .note { font-weight:400; font-size:11px; color:#c0392b; margin-left:6px; }
  .coin-box > summary .samt { font-family:ui-monospace,monospace; font-weight:800; font-size:15px; color:#556; }
  .coin-box table { width:100%; font-size:13px; border-collapse:collapse; }
  .coin-box table td { padding:5px 0; }
  .coin-box table td.num { text-align:right; font-family:ui-monospace,monospace; white-space:nowrap; }
  .coin-box .grp { font-size:11.5px; color:#888; font-weight:700; margin:10px 0 3px; }
  .coin-box .subtot { border-top:1px dashed #99a; font-weight:700; color:#556; }
  .coin-box .grand { border-top:1.5px solid #889; margin-top:8px; padding-top:7px; display:flex;
    justify-content:space-between; font-weight:800; color:#445; }
  .coin-box .disclaimer { margin-top:10px; font-size:12px; color:#556; background:#eceef1;
    border-radius:7px; padding:9px 12px; line-height:1.6; }

  /* ④ 배차요청서 — 네이비 배경 + 골드 버튼(항상 강조, 맨 아래) */
  .dispatch { margin:22px 0 8px; padding:24px 22px; text-align:center; border-radius:14px;
    background:linear-gradient(135deg,var(--navy) 0%,#2c4060 100%);
    box-shadow:0 5px 16px rgba(27,42,59,0.25); }
  .dispatch .dtitle { color:#ffd87a; font-size:13px; font-weight:800; letter-spacing:.04em; }
  .dispatch .ddesc { color:#c6d5e8; font-size:12.5px; margin:8px 0 16px; line-height:1.6; }
  .dispatch .daddr { margin:12px auto 4px; max-width:340px; text-align:left;
    background:rgba(255,255,255,0.07); border:1px solid rgba(255,216,122,0.3); border-radius:9px; padding:10px 14px; }
  .dispatch .darow { display:flex; gap:10px; padding:3px 0; font-size:13px; }
  .dispatch .darow .dk { color:#ffd87a; font-weight:700; min-width:44px; }
  .dispatch .darow .dv { color:#eef2f7; }
  .dispatch .darow .dv em { color:#c6d5e8; font-style:normal; font-size:11px; }
  .dispatch a.dbtn { display:inline-block; padding:16px 44px; background:var(--gold); color:#1B2A3B;
    border-radius:11px; font-size:17px; font-weight:800; text-decoration:none;
    box-shadow:0 4px 14px rgba(201,151,58,0.4); transition:transform .1s, box-shadow .1s; }
  .dispatch a.dbtn:hover { transform:translateY(-1px); box-shadow:0 7px 18px rgba(201,151,58,0.5); }

  /* FTA 비교 2단(펼침 내부) */
  .cmp { display:flex; gap:12px; align-items:stretch; margin-top:4px; }
  .cmp .col { flex:1; padding:11px 14px; border-radius:8px; font-size:12px; }
  .cmp .col.base { background:#f4f4f4; opacity:.75; }
  .cmp .col.fta { background:#fff; border:2px solid var(--gold); }
  .cmp .row { display:flex; justify-content:space-between; margin-top:4px; }
  .cmp .row span:last-child { font-family:ui-monospace,monospace; }
  .cmp .col.base .row { color:#999; text-decoration:line-through; }
  .cmp .col .tot { margin-top:5px; padding-top:5px; border-top:1px solid var(--line); font-weight:700; }
  .cmp .badge { background:var(--gold); color:#fff; font-size:9px; font-weight:700; padding:2px 9px;
    border-radius:10px; letter-spacing:.04em; }

  .foot { font-size:11px; color:#888; text-align:center; line-height:1.7; padding-top:18px;
    margin-top:20px; border-top:1px solid var(--line); }
  .loading, .err { padding:60px 30px; text-align:center; color:#888; }
  .err { color:#c0392b; }

  @media (max-width:600px) {
    body { padding:6px; }
    .container { padding:18px; }
    .info-grid { grid-template-columns:1fr; }
    header { flex-direction:column; }
    header .meta { text-align:left; }
    .pay-box .pamt { font-size:30px; }
    .cmp { flex-direction:column; }
    .dispatch a.dbtn { width:90%; padding:15px 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <div id="root"><div class="loading">⏳ 청구서 불러오는 중...</div></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const mailbox = params.get('mailbox') || params.get('ship') || params.get('s') || '';

async function loadInvoice() {
  const root = document.getElementById('root');
  if (!mailbox) { root.innerHTML = '<div class="err">⚠ 사서함 번호가 URL에 없습니다.</div>'; return; }
  try {
    const r = await fetch('/api/invoice-view?mailbox=' + encodeURIComponent(mailbox));
    const data = await r.json();
    if (!r.ok || !data.ok) {
      root.innerHTML = '<div class="err">⚠ ' + (data.error || ('HTTP ' + r.status)) + '</div>';
      return;
    }
    render(data);
  } catch (e) {
    root.innerHTML = '<div class="err">⚠ 청구서 로드 실패: ' + e.message + '</div>';
  }
}

function fmtKrw(n) { return '₩' + Math.round(parseFloat(n) || 0).toLocaleString(); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// [v3.2.219] 주소 앞부분만 표시(시·구·도로명까지, 상세번지 가림) — 배차 도착지 프라이버시.
function maskAddr(addr) {
  addr = String(addr == null ? '' : addr).trim();
  if (!addr) return '';
  var t = addr.split(/\s+/), out = [], found = false;
  for (var i = 0; i < t.length; i++) {
    var m = t[i].match(/^(.*?(?:로|길|대로))(?:\d.*)?$/);
    if (m) { out.push(m[1]); found = true; break; }
    out.push(t[i]);
  }
  if (!found) out = t.slice(0, Math.min(3, t.length));
  return out.join(' ') + ' ****';
}

// FTA 비교 2단(기본세율 취소선 vs 적용 FTA) — 도구가 URL 파라미터로 전달한 숫자를 그대로 렌더(서버 재계산 없음).
//   ② 펼침 내부에 삽입. 파라미터 없음/불완전/절감0 → '' (펼침 시 요약 문구만).
function renderFtaCompare() {
  const bd = parseFloat(params.get('tcbd')), bv = parseFloat(params.get('tcbv')), bt = parseFloat(params.get('tcbt'));
  const fd = parseFloat(params.get('tcfd')), fv = parseFloat(params.get('tcfv')), ft = parseFloat(params.get('tcft'));
  const sv = parseFloat(params.get('tcsv')); const fl = params.get('tcfl') || '적용 FTA';
  if (![bd, bv, bt, fd, fv, ft, sv].every(n => !isNaN(n)) || sv <= 0) return '';
  return `
    <div class="cmp">
      <div class="col base">
        <div style="font-weight:700; color:var(--navy); margin-bottom:6px;">기본세율 <span style="font-weight:400; color:#aaa;">(FTA 미적용)</span></div>
        <div class="row"><span>관세</span><span>${fmtKrw(bd)}</span></div>
        <div class="row"><span>부가세 10%</span><span>${fmtKrw(bv)}</span></div>
        <div class="row tot"><span>합계</span><span>${fmtKrw(bt)}</span></div>
      </div>
      <div class="col fta">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-weight:700; color:var(--navy);">${esc(fl)}</span><span class="badge">적용</span>
        </div>
        <div class="row"><span>관세</span><span>${fmtKrw(fd)}</span></div>
        <div class="row"><span>부가세 10%</span><span>${fmtKrw(fv)}</span></div>
        <div class="row tot" style="color:var(--navy);"><span>합계</span><span>${fmtKrw(ft)}</span></div>
      </div>
    </div>
    <div style="font-size:10px; color:#aaa; margin-top:8px;">※ 표시 금액은 예상치이며, 정확한 관세·부가세는 협력 관세사 검토 후 안내됩니다. 이 절감액은 강하고 청구금액과 별개입니다.</div>`;
}

function render(d) {
  const root = document.getElementById('root');
  const s = d.shipment, c = d.customer, t = d.totals, bd = d.breakdown || {}, al = d.alicoin || {};
  const issuer = d.issuer || {
    name: '주식회사 테일코리아', biz: '162-86-01960', addr: '인천시 서구 북항로 207번길 55',
    tel: '010-3622-7995', email: 'admin@talekorea.com',
    bank: '하나은행 121-910031-58704', bankHolder: '예금주 주식회사 테일코리아',
  };
  const ftaSavingKrw = (t && t.ftaSavingKrw) || 0;   // 저장값(청구_FTA_절세_KRW, §9 발행 시 저장)
  // [v3.2.223] ② FTA 단일 소스 — live(URL tcsv) 우선, 없으면 저장값 폴백. 헤더·본문·비교표가 같은 값을 봄(모순 제거).
  const _tcsvLive = parseFloat(params.get('tcsv')) || 0;
  const ftaSaving = _tcsvLive > 0 ? _tcsvLive : ftaSavingKrw;
  const claimAmount = t.claimKrw || 0;
  const paidIn = !!d.paidInAt;
  const issueDate = (d.shipment && d.shipment.issueDate) ? d.shipment.issueDate.slice(0, 10) : (d.generatedAt || '').slice(0, 10);

  // 국내운임(pre-VAT) + VAT — 표시용(계산 불변, 서버 값 그대로)
  const itemRows = [];
  if (bd.parcel > 0)  itemRows.push({ name: '택배 (매트릭스)', amount: bd.parcel });
  if (bd.freight > 0) itemRows.push({ name: '화물',           amount: bd.freight });
  if (bd.milkrun > 0) itemRows.push({ name: '밀크런',         amount: bd.milkrun });
  if (bd.coupang > 0) itemRows.push({ name: '쿠팡 밀크런',    amount: bd.coupang });
  const preVatSum = itemRows.reduce((sm, r) => sm + r.amount, 0);
  const preVat = (t.preVat && t.preVat > 0) ? t.preVat : preVatSum;
  const vat = t.vat || Math.round(preVat * 0.10);

  // ① 실제 입금 금액 박스 (3상태: 입금완료 / 청구액>0 / 발행대기)
  let payBox;
  if (paidIn) {
    payBox = `<div class="pri pay-box paid">
      <div class="plabel">① 결제 상태</div>
      <div class="pamt paid-badge" style="font-size:24px;">✅ 입금 확인 완료</div>
      <div class="pbreak">통관을 진행하고 있습니다. 감사합니다.</div>
    </div>`;
  } else if (claimAmount > 0) {
    payBox = `<div class="pri pay-box">
      <div class="plabel">① 실제 입금하실 금액 <span class="tag">계좌이체 · 세금계산서</span></div>
      <div class="pamt">${fmtKrw(claimAmount)} <small>(VAT 포함)</small></div>
      <div class="pbreak">국내운임 ${fmtKrw(preVat)} + 부가세 10% ${fmtKrw(vat)}</div>
      <div class="bank">
        <div style="font-size:11px; color:#888; font-weight:600;">입금 계좌</div>
        <div class="bk">${esc(issuer.bank)}</div>
        ${issuer.bankHolder ? `<div class="holder">${esc(issuer.bankHolder)}</div>` : ''}
      </div>
      <div class="depositor">※ 입금 시 <strong>사서함번호(${esc(s.mailbox)})</strong> 또는 <strong>상호</strong>를 입금자명에 기재해 주세요.<br>※ 입금 확인 후 영업일 1~2일 내 통관을 진행하고, 세금계산서를 발행해 드립니다.</div>
    </div>`;
  } else {
    payBox = `<div class="pri pay-box wait">
      <div class="plabel" style="color:#999;">① 실제 입금하실 금액</div>
      <div class="pamt" style="font-size:22px; color:#999;">청구서 발행 대기</div>
      <div class="pbreak">담당자가 국내운임 확정 후 금액을 안내드립니다.</div>
    </div>`;
  }

  // ② FTA 절감 혜택 (초록 · ftaSavingKrw>0일 때만)
  const cmpHtml = renderFtaCompare();
  const ftaBox = `
    <details class="pri fta-box">
      <summary>
        <span class="stitle">💚 ② FTA 절감 혜택 <span style="font-weight:400; font-size:11px; color:#888;">(고객님이 아끼신 금액)</span></span>
        <span style="display:flex; align-items:center; gap:8px;"><span class="samt">${ftaSaving > 0 ? '− ' + fmtKrw(ftaSaving) : '적용분 없음'}</span><span class="chev">▼</span></span>
      </summary>
      <div class="body">
        <div style="font-size:12.5px; color:var(--dim); margin-bottom:10px;">${ftaSaving > 0 ? `기본세율 대신 <strong>FTA 특혜세율</strong>을 적용해 관세 <strong style="color:#1a8a52;">${fmtKrw(ftaSaving)}</strong>을 절감했습니다.${(t.appliedFta && t.appliedFta !== '미선택') ? ` (적용: ${esc(t.appliedFta)})` : ''}` : '이 사서함은 FTA 특혜세율 적용분이 없습니다(기본세율 신고). 절감액은 FTA 적용 사서함에서 표시됩니다.'}</div>
        ${ftaSaving > 0 ? (cmpHtml || '<div style="font-size:11px; color:#aaa;">※ 세부 비교표는 관세사 검토 후 제공됩니다. 관세·수입부가세는 관세사가 화주에게 직접 청구합니다(강하고 청구서 미포함).</div>') : ''}
      </div>
    </details>`;

  // ③ 알리코인 차감 (회색 · grandUse>0일 때만) — CNY만 표시(≈₩ 미표시), "입금 아님" 명시
  const grandUse = (al.grandUseCny != null) ? al.grandUseCny : ((al.totalCny || 0) + (al.localWorkCny || 0));
  const coDesc = (al.coSheets > 1)
    ? ` <span style="font-size:11px; color:#888;">· ${al.coSheets}장 (기본¥${al.coBase}+장추가¥${al.coAddCny} · CO종류 ${al.coTypes}개)</span>`
    : (al.coTypes ? ` <span style="font-size:11px; color:#888;">· 1장 (CO종류 ${al.coTypes}개)</span>` : '');
  const coinBox = `
    <details class="pri coin-box">
      <summary>
        <span class="stitle">🪙 ③ 알리코인(예치금) 차감<span class="note">참고 · 계좌이체 아님</span></span>
        <span style="display:flex; align-items:center; gap:8px;"><span class="samt">${grandUse > 0 ? '¥' + grandUse.toFixed(2) : '차감 내역 없음'}</span><span class="chev">▼</span></span>
      </summary>
      <div class="body">
        ${grandUse > 0 ? `<div class="grp">［강하고 서비스 수수료］</div>
        <table>
          <tr><td>BL 발급료</td><td class="num">¥${(al.blCny || 0).toFixed(2)}</td></tr>
          <tr><td>해운비 <span style="font-size:11px; color:#888;">(FREIGHT PREPAID)</span></td><td class="num">¥${(al.seaCny || 0).toFixed(2)}</td></tr>
          ${(al.coCny || 0) > 0 ? `<tr><td>원산지증명(CO)${coDesc}</td><td class="num">¥${al.coCny.toFixed(2)}</td></tr>` : ''}
          <tr><td>작업수수료 <span style="font-size:11px; color:#888;">(핸들링+DOCUMENT FEE)</span></td><td class="num">¥${(al.workfeeCny || 0).toFixed(2)}</td></tr>
          <tr class="subtot"><td>└ 서비스 수수료 소계</td><td class="num">¥${(al.totalCny || 0).toFixed(2)}</td></tr>
        </table>
        ${(al.localWorkCny > 0) ? `
        <div class="grp">［중국 현지 작업비］ <span style="font-weight:400; color:#c0392b;">제품 신고가에 이미 반영 · 참고</span></div>
        <table><tr><td>🏭 중국 현지 작업비</td><td class="num" style="font-weight:700;">¥${(al.localWorkCny || 0).toFixed(2)}</td></tr></table>
        <details style="margin-top:4px;"><summary style="cursor:pointer; font-size:12px; color:#556;">세부보기 ▼ (${(al.localWorkItems || []).length}항목)</summary>
          <table style="margin-top:5px; font-size:12px; color:#555;">${(al.localWorkItems || []).map(it => { const qu = (it.qty != null && it.unit != null) ? `${it.qty}개 × ¥${it.unit}` : ''; return `<tr><td style="padding:3px 6px 3px 0;">${esc(it.label)}</td><td style="padding:3px 8px; color:#888; white-space:nowrap;">${qu}</td><td class="num">¥${(it.cny || 0).toFixed(2)}</td></tr>`; }).join('')}</table>
        </details>` : ''}
        <div class="grand"><span>🪙 알리코인 총 사용 (참고)</span><span style="font-family:ui-monospace,monospace;">¥${grandUse.toFixed(2)}</span></div>
        <div class="disclaimer">위 금액은 <strong>알리코인(예치금)에서 이미 차감</strong>되었습니다. 계좌이체로 <strong>추가 청구하지 않습니다</strong>(이중청구 아님).</div>` : `<div style="font-size:12.5px; color:var(--dim);">알리코인(예치금) 차감 내역이 없습니다. BL·해운비·CO·작업수수료 발생 시 여기에 표시됩니다.</div>`}
      </div>
    </details>`;

  // ④ 배차요청서 (네이비+골드 CTA · 맨 아래 · 접기 없음 · ★항상 표시)
  //   링크: 토큰 있으면 완성 URL(s.deliveryUrl), 없으면 delivery-request.html?s={shipmentId} 폴백.
  const dispatchHref = s.deliveryUrl || ('/delivery-request.html?s=' + encodeURIComponent(s.id || s.mailbox || ''));
  const dispatchBox = `
    <div class="dispatch">
      <div class="dtitle">🚚 ④ 배송정보를 입력해 주세요</div>
      <div class="daddr">
        <div class="darow"><span class="dk">출발지</span><span class="dv">${esc(s.bondedWarehouse || '인천항 보세창고')}</span></div>
        <div class="darow"><span class="dk">도착지</span><span class="dv">${s.deliveryAddr ? esc(maskAddr(s.deliveryAddr)) : '고객님 요청 주소 <em>(입력 필요)</em>'}</span></div>
      </div>
      <div class="ddesc">통관 완료 후 신속한 배차를 위해, 미리 결제와 배송정보를 등록해 주세요.<br>결제가 확인되면 통관·배차가 바로 진행됩니다.</div>
      <a class="dbtn" href="${dispatchHref}" target="_blank" rel="noopener">배차요청서 작성하기</a>
    </div>`;

  root.innerHTML = `
    <header>
      <div style="display:flex; align-items:center; gap:14px;">
        <img src="/kanghago_logo.png" alt="강하고" onerror="this.style.display='none'" />
        <div>
          <h1>청구서 <span style="font-size:15px; font-weight:600; color:var(--gold);">INVOICE</span></h1>
          <div class="sub">강하고 물류비 · KANGHAGO LOGISTICS</div>
        </div>
      </div>
      <div class="meta">
        <div><strong>청구번호</strong> ${esc(s.mailbox)}</div>
        <div><strong>발행일</strong> ${esc(issueDate)}</div>
        ${s.blNo ? `<div><strong>BL No.</strong> ${esc(s.blNo)}</div>` : ''}
        ${s.forwarder ? `<div><strong>포워딩</strong> ${esc(s.forwarder)}</div>` : ''}
      </div>
    </header>

    <div class="info-grid">
      <div class="card">
        <div class="label">발행처</div>
        <div class="value">${esc(issuer.name)}</div>
        <div class="sub">사업자 ${esc(issuer.biz)}</div>
        <div class="sub">${esc(issuer.addr)}</div>
        <div class="sub">${esc(issuer.tel)} · ${esc(issuer.email)}</div>
      </div>
      <div class="card">
        <div class="label">수신처 (고객)</div>
        <div class="value">${esc(s.mailbox)} ${esc(c && c.name || '-')}${c && c.company ? ' (' + esc(c.company) + ')' : ''}</div>
        ${c && c.bizNo ? `<div class="sub">사업자: ${esc(c.bizNo)}</div>` : ''}
        ${c && c.address ? `<div class="sub">${esc(c.address)}</div>` : ''}
        ${c && c.phone ? `<div class="sub">Tel: ${esc(c.phone)}</div>` : ''}
      </div>
    </div>

    ${payBox}
    ${ftaBox}
    ${coinBox}
    ${dispatchBox}

    <div class="foot">
      <div>강하고 (Kanghago) · 한·중 1688 무역대행 · 발행: ${esc(issuer.name)} (${esc(issuer.biz)})</div>
      <div>문의: ${esc(issuer.tel)} · ${esc(issuer.email)}</div>
      <div style="margin-top:6px; color:#bbb;">청구번호 ${esc(s.mailbox)} · 발행 ${esc(issueDate)}</div>
      <div style="margin-top:3px; color:#999; font-size:10px;">① 국내 결제 = 국내운임(택배/화물/밀크런) × 1.10 · ③ BL·해운비·CO·작업수수료는 알리코인(예치금) 차감(FREIGHT PREPAID, 계좌이체 아님)</div>
    </div>
  `;
}

loadInvoice();
</script>
</body>
</html>
