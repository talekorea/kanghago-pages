<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>강하고 — 로그인</title>
<style>
  :root { --gold:#C9973A; --navy:#1B2A3B; --bg:#F4EFE6; --ivory:#FAF6EE; }
  * { box-sizing: border-box; }
  body { font-family:'Pretendard',-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif;
    margin:0; background:var(--bg); color:#1d1d1f; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:#fff; border-radius:16px; padding:40px 34px; max-width:420px; width:100%;
    box-shadow:0 8px 28px rgba(27,42,59,0.12); }
  .brand { text-align:center; margin-bottom:6px; }
  .brand .logo { font-size:28px; font-weight:800; color:var(--gold); letter-spacing:-0.5px; }
  h1 { margin:8px 0 4px; font-size:20px; color:var(--navy); text-align:center; }
  .sub { color:#888; font-size:13px; margin-bottom:24px; text-align:center; }
  label { display:block; font-size:12px; font-weight:600; color:#444; margin:12px 0 5px; }
  input { width:100%; padding:11px 13px; border:1px solid #d4c5a8; border-radius:8px;
    font-size:15px; font-family:inherit; background:var(--ivory); }
  input:focus { outline:none; border-color:var(--gold); }
  button.submit { width:100%; margin-top:22px; padding:13px; background:var(--navy); color:#fff;
    border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; }
  button.submit:hover:not(:disabled) { background:#0f1d2c; }
  button.submit:disabled { background:#aaa; cursor:not-allowed; }
  .msg { margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13px; line-height:1.5; }
  .msg.ok { background:#e8f5e9; border:1px solid #4caf50; color:#1b5e20; }
  .msg.err { background:#fff5f5; border:1px solid #f5c2c7; color:#c0392b; }
  .msg.warn { background:#fff8e1; border:1px solid #C9973A; color:#9a7b2a; }
  .footer { text-align:center; color:#999; font-size:12px; margin-top:20px; }
  .footer a { color:var(--gold); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="logo">강하고</span></div>
  <h1>로그인</h1>
  <div class="sub">한-중 1688 무역대행</div>
  <form id="loginForm">
    <label>이메일</label>
    <input id="email" type="email" required autocomplete="email" />
    <label>비밀번호</label>
    <input id="password" type="password" required autocomplete="current-password" />
    <button type="submit" class="submit" id="submitBtn">로그인</button>
  </form>
  <div id="msg"></div>
  <div class="footer">아직 회원이 아니신가요? <a href="/member-signup.html">회원가입</a></div>
</div>

<script type="module">
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  const show = (t, k) => { msg.className = 'msg ' + (k||''); msg.innerHTML = t; };

  let supabase = null;
  async function loadSupabase() {
    const cfg = await (await fetch('/api/agent-config')).json();
    if (cfg.error) throw new Error(cfg.error);
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/+esm');
    supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
      auth: {
        persistSession: true, autoRefreshToken: true, detectSessionInUrl: true,
        storage: window.localStorage, storageKey: 'sb-kanghago-member', flowType: 'implicit',
      },
    });
  }

  // 이미 로그인된 세션 있으면 status 확인 후 분기
  async function checkExisting() {
    if (!supabase) await loadSupabase();
    const { data: { session } } = await supabase.auth.getSession();
    if (session) await routeByStatus(session.access_token);
  }

  async function routeByStatus(token) {
    const r = await fetch('/api/members?op=me', { headers: { 'Authorization': 'Bearer ' + token } });
    const out = await r.json();
    if (r.status === 404 || out.notFound) {
      show('⚠ 회원 정보가 없습니다. <a href="/member-signup.html">회원가입</a>을 완료해 주세요.', 'warn');
      return;
    }
    if (!r.ok) { show('❌ ' + (out.error || 'HTTP ' + r.status), 'err'); return; }
    const status = out.member.status;
    if (status === 'active') { location.replace('/member-dashboard.html'); return; }
    if (status === 'pending') { show('⏳ <strong>승인 대기 중</strong>입니다. 관리자 승인 후 이용 가능합니다.', 'warn'); return; }
    if (status === 'rejected') { show('❌ 가입이 거절되었습니다. 문의: master@talekorea.com / 1661-5776', 'err'); return; }
    if (status === 'suspended') { show('⛔ 정지된 계정입니다. 문의: master@talekorea.com', 'err'); return; }
    show('상태 확인 불가: ' + status, 'warn');
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = '로그인 중...'; show('', '');
    try {
      if (!supabase) await loadSupabase();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await routeByStatus(data.session.access_token);
    } catch (err) {
      show('❌ ' + (err.message || '로그인 실패'), 'err');
    } finally {
      btn.disabled = false; btn.textContent = '로그인';
    }
  });

  checkExisting();
</script>
</body>
</html>
